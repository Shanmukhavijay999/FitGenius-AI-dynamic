services:
  # Render Web Service for Full FitGenius Stack (Express API + Next.js App)
  - type: web
    name: fitgenius-ai-app
    env: node
    region: singapore
    plan: free
    buildCommand: npm run install:all && npm run build --prefix frontend
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET_KEY
        value: super_secret_key_fitgenius_2026
      - key: RAZORPAY_KEY_ID
        value: rzp_test_fitgenius_demo
      - key: RAZORPAY_KEY_SECRET
        value: fitgenius_demo_secret_key
