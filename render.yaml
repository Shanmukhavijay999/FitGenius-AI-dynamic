services:
  # 1. Express Backend Service on Render
  - type: web
    name: fitgenius-ai-backend
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET_KEY
        value: super_secret_key_fitgenius_2026
      - key: RAZORPAY_KEY_ID
        value: rzp_test_fitgenius_demo
      - key: RAZORPAY_KEY_SECRET
        value: fitgenius_demo_secret_key

  # 2. Next.js Frontend Service on Render
  - type: web
    name: fitgenius-ai-frontend
    env: node
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
